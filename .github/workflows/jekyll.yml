name: Deploy Jekyll site to Pages

on:
  workflow_run:
    workflows: ["Update Submodule"]
    types:
      - completed
  workflow_dispatch:
  push:
    branches: ["main"]
  schedule:
    # 매일 UTC 00:00 (한국시간 09:00)에 서브모듈 체크
    - cron: '0 0 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true # 서브모듈도 함께 체크아웃
          fetch-depth: 0
      
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Generate Algorithm list
        run: ruby scripts/generate_algorithm.rb

      - name: Generate Algorithm level
        run: ruby scripts/generate_algo_level.rb

      - name: Generate Tiers Category
        run: ruby scripts/generate_tier.rb

      - name: Generate Problems structure
        run: ruby scripts/generate_problem.rb

      - name: Generate sidebar structure
        run: ruby scripts/generate_sidebar.rb

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enablement: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          target_branch: gh-pages

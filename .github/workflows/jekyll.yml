name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  get-ga-data:
    # 커밋 메시지에 [skip ga]가 포함되어 있으면 이 작업을 건너뜁니다.
    if: "!contains(github.event.head_commit.message, '[skip ga]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install google-analytics-data
      - name: Fetch GA4 Statistics
        env:
          ANALYTICS_JSON: ${{ secrets.ANALYTICS_JSON }}
          ANALYTICS_PROPERTY: ${{ secrets.ANALYTICS_PROPERTY }}
        run: |
          mkdir -p _data
          echo "$ANALYTICS_JSON" > credentials.json
          python scripts/update_stats.py
          rm credentials.json
      - name: Upload stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats-data
          path: _data/stats.json

  build-platform:
    runs-on: ubuntu-latest
    needs: get-ga-data
    # get-ga-data가 성공했거나(성공) 건너뛰었을 때(skipped) 실행됩니다.
    if: always() && (needs.get-ga-data.result == 'success' || needs.get-ga-data.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      
      # GA 데이터 작업이 실행되었을 때만 아티팩트를 다운로드합니다.
      - name: Download stats artifact
        if: needs.get-ga-data.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: stats-data
          path: _data/

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Generate Content
        run: |
          ruby scripts/generate_algorithm.rb
          ruby scripts/generate_algo_level.rb
          ruby scripts/generate_tier.rb
          ruby scripts/generate_problem.rb
          ruby scripts/generate_sidebar.rb

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enablement: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-platform
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Jekyll site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: '0 22 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  get-ga-data:
    # 커밋 메시지에 [skip ga]가 포함되어 있으면 이 작업을 건너뜁니다.
    if: "!contains(github.event.head_commit.message, '[skip ga]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install google-analytics-data
      - name: Fetch GA4 Statistics
        env:
          ANALYTICS_JSON: ${{ secrets.ANALYTICS_JSON }}
          ANALYTICS_PROPERTY: ${{ secrets.ANALYTICS_PROPERTY }}
        run: |
          mkdir -p _data
          echo "$ANALYTICS_JSON" > credentials.json
          python - <<'PY'
          import os, json, sys
          from datetime import datetime, timedelta
          from google.analytics.data_v1beta import BetaAnalyticsDataClient
          from google.analytics.data_v1beta.types import (
              DateRange, Dimension, Metric, RunReportRequest, FilterExpression, Filter
          )

          property_id = os.environ.get("ANALYTICS_PROPERTY")
          os.environ["GOOGLE_APPLICATION_CREDENTIALS"] = "credentials.json"
          if not property_id:
              print("Error: ANALYTICS_PROPERTY is missing.")
              sys.exit(1)

          client = BetaAnalyticsDataClient()

          def get_daily_data(days, page_path=None):
              yesterday = datetime.now() - timedelta(days=1)
              date_list = [(yesterday - timedelta(days=i)).strftime('%Y-%m-%d') for i in range(days)]
              results_dict = {date: 0 for date in date_list}
              dim_filter = None
              if page_path:
                  dim_filter = FilterExpression(filter=Filter(
                      field_name="pagePath",
                      string_filter=Filter.StringFilter(
                          match_type=Filter.StringFilter.MatchType.BEGINS_WITH, value=page_path
                      )
                  ))
              request = RunReportRequest(
                  property=f"properties/{property_id}",
                  dimensions=[Dimension(name="date")],
                  metrics=[Metric(name="activeUsers")],
                  date_ranges=[DateRange(start_date=f"{days}daysAgo", end_date="yesterday")],
                  dimension_filter=dim_filter
              )
              response = client.run_report(request)
              for row in response.rows:
                  raw_date = row.dimension_values[0].value
                  formatted_date = f"{raw_date[:4]}-{raw_date[4:6]}-{raw_date[6:]}"
                  if formatted_date in results_dict:
                      results_dict[formatted_date] = int(row.metric_values[0].value)
              return [{"date": k, "value": v} for k, v in sorted(results_dict.items())]

          def get_monthly_data(months, page_path=None):
              now = datetime.now()
              results_dict = {}
              curr_date = now
              for _ in range(months):
                  m_key = curr_date.strftime('%Y-%m')
                  results_dict[m_key] = 0
                  curr_date = (curr_date.replace(day=1) - timedelta(days=1))
              dim_filter = None
              if page_path:
                  dim_filter = FilterExpression(filter=Filter(
                      field_name="pagePath",
                      string_filter=Filter.StringFilter(
                          match_type=Filter.StringFilter.MatchType.BEGINS_WITH, value=page_path
                      )
                  ))
              request = RunReportRequest(
                  property=f"properties/{property_id}",
                  dimensions=[Dimension(name="yearMonth")],
                  metrics=[Metric(name="activeUsers")],
                  date_ranges=[DateRange(start_date=f"{months*30}daysAgo", end_date="yesterday")],
                  dimension_filter=dim_filter
              )
              response = client.run_report(request)
              for row in response.rows:
                  raw_month = row.dimension_values[0].value
                  formatted_month = f"{raw_month[:4]}-{raw_month[4:]}"
                  if formatted_month in results_dict:
                      results_dict[formatted_month] = int(row.metric_values[0].value)
              return [{"month": k, "value": v} for k, v in sorted(results_dict.items())]

          stats = {
              "home": {"daily": get_daily_data(8), "monthly": get_monthly_data(4)},
              "about": {
                  "daily": get_daily_data(8, page_path="/about"),
                  "monthly": get_monthly_data(4, page_path="/about")
              }
          }
          with open('_data/stats.json', 'w', encoding='utf-8') as f:
              json.dump(stats, f, indent=2, ensure_ascii=False)
          print("Stats updated successfully!")
          PY
          rm -f credentials.json
      - name: Upload stats artifact
        uses: actions/upload-artifact@v4
        with:
          name: stats-data
          path: _data/stats.json

  build-platform:
    runs-on: ubuntu-latest
    needs: get-ga-data
    # get-ga-data가 성공했거나(성공) 건너뛰었을 때(skipped) 실행됩니다.
    if: always() && (needs.get-ga-data.result == 'success' || needs.get-ga-data.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      
      # GA 데이터 작업이 실행되었을 때만 아티팩트를 다운로드합니다.
      - name: Download stats artifact
        if: needs.get-ga-data.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: stats-data
          path: _data/

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Generate Content
        run: |
          ruby scripts/generate_algorithm.rb
          ruby scripts/generate_algo_level.rb
          ruby scripts/generate_tier.rb
          ruby scripts/generate_problem.rb
          ruby scripts/generate_search_index.rb
          ruby scripts/generate_sidebar.rb
          ruby scripts/sync_trade_daily_report.rb
          ruby scripts/sync_trade_journal.rb

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          enablement: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build-platform
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: AdSense page exclusion checks

on:
  pull_request:

permissions:
  contents: read

jobs:
  verify-ads:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Production build with configured AdSense ID
        env:
          JEKYLL_ENV: production
        run: |
          bundle exec jekyll build
          python3 .github/scripts/check_ads_build.py prod_config

      # Override files never change the committed publisher ID.
      # Dummy IDs are used only inside the isolated Actions runner.
      - name: Production build with test AdSense ID
        env:
          JEKYLL_ENV: production
        run: |
          printf 'adsense:\n  client: "ca-pub-0000000000000000"\n' > "$RUNNER_TEMP/ads-test.yml"
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/ads-test.yml"
          python3 .github/scripts/check_ads_build.py prod_test

      - name: Production build with AdSense disabled
        env:
          JEKYLL_ENV: production
        run: |
          printf 'adsense:\n  client: ""\n' > "$RUNNER_TEMP/ads-disabled.yml"
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/ads-disabled.yml"
          python3 .github/scripts/check_ads_build.py prod_empty

      - name: Development build never loads ads
        env:
          JEKYLL_ENV: development
        run: |
          bundle exec jekyll build --config "_config.yml,$RUNNER_TEMP/ads-test.yml"
          python3 .github/scripts/check_ads_build.py dev_test

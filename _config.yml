title: "QA & Engineering Blog"
description: "A Blog about Quality · Automation · Engineering"
baseurl: ""
url: "https://kimsc9976.github.io"
lang: ko

markdown: kramdown

plugins:
  - jekyll-sitemap
  - jekyll-feed

feed:
  path: feed.xml
  excerpt_only: true

author:
  name: 김수찬

kramdown:
  toc_levels: 1..2

# Jekyll이 modules 폴더를 포함하도록 설정
include:
  - modules

permalink: /log/:categories/:year/:month/:day/:title/
# # 카테고리 설정
collections:
  algorithm:
    output: true
    # permalink: /algorithm/:path/  # :path 변수가 한글 경로를 제대로 처리하지 못함
  sideproject:
    output: true
    permalink: /sideproject/:project/:title/
  log:
    output: true
    # permalink는 각 파일의 front matter에서 명시적으로 지정

# permalink: /blog/:category/:year/:month/:day/:title/

# Jekyll 빌드 산출물(_site)에서 제외할 항목
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - modules
  # 내부 운영/빌드 파일이 배포 사이트에 노출되지 않도록 제외
  - credentials.json
  - scripts/
  - SETUP_INSTRUCTIONS.md
  - SETUP_TRADE_REPORT_SYNC.md
  - PROJECT_STRUCTURE.md
  - requirements.txt
  - "*.bat"
  - .github/

# sitemap.xml 기본값 (yenarue 글 권장: weekly / 0.5)
defaults:
  - scope:
      path: ""
    values:
      sitemap:
        changefreq: weekly
        priority: 0.5
  - scope:
      path: ""
      type: posts
    values:
      sitemap:
        changefreq: monthly
        priority: 0.7
  - scope:
      path: "index.md"
    values:
      sitemap:
        changefreq: weekly
        priority: 1.0

# # paginate: 5
# # paginate_path: "/page:num/"
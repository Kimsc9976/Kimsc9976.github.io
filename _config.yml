title: "QA & Engineering Blog"
description: "A Blog about Quality · Automation · Engineering"
baseurl: ""
url: "https://Kimsc9976.github.io"

markdown: kramdown

kramdown:
  toc_levels: 1..2

# Jekyll이 modules 폴더를 포함하도록 설정
include:
  - modules

permalink: /log/:categories/:year/:month/:day/:title/
# # 카테고리 설정
collections:
  algorithm:
    output: true
    # permalink: /algorithm/:path/  # :path 변수가 한글 경로를 제대로 처리하지 못함
  sideproject:
    output: true
    permalink: /sideproject/:project/:title/
  log:
    output: true
    # permalink는 각 파일의 front matter에서 명시적으로 지정

# permalink: /blog/:category/:year/:month/:day/:title/

# Jekyll이 modules 폴더를 제외하지 않도록 설정
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - modules


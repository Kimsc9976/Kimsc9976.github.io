title: "My GitHub Pages"
description: "This is my personal GitHub Pages website."
baseurl: ""
url: "https://Kimsc9976.github.io"

# Jekyll이 modules 폴더를 포함하도록 설정
include:
  - modules

collections:
  algorithm:
    output: true
    # permalink는 각 파일의 front matter에서 명시적으로 지정
    # permalink: /algorithm/:path/  # :path 변수가 한글 경로를 제대로 처리하지 못함

# Jekyll이 modules 폴더를 제외하지 않도록 설정
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - modules


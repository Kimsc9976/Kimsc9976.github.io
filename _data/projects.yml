- title: "미리디 - 비즈하우스"
  period: 2025.04 ~ 2025.06
  summary: "실제 사용자의 경험 기반으로 UI/UX 에 대한 A/B 테스트 & Usability Test 수행"
  points:
    - UI/UX 개선안에 대한 A/B 테스트 설계 및 검증 수행
    - 사용자 행동 데이터를 기반으로 기능/흐름 검증 및 리스크 판단
    - 제품군 단위 유저 시나리오를 바탕으로 Automation Test 수행

- title: 요기요
  period: 2024.09
  summary: 로봇 배달 서비스 PoC 및 현장 테스트 수행
  points:
    - 현장 PoC 셋업 및 검증 대응
    - 주요 기술/운영 이슈를 분석하고 관련 부서와 공유
    - 주행 경로 및 로봇 운행 특이사항 정리, 리스크 최소화

- title: 신세계 레저산업
  period: 2024.04
  summary: 자유CC 식음료 배달 PoC 및 현장 QA 수행
  points:
    - PoC 셋업 완료를 위한 현장 대응 및 검증 진행
    - 현장 테스트 중 발생한 주요 운영/시스템 이슈 분석 및 보고
    - 서비스 안정성을 위한 개선 포인트 도출

- title: 롯데 이노베이트
  period: 2024.11
  summary: 안전 로봇 품질 검증 및 자율주행 안정성 평가
  points:
    - Third Party 통합 후 자율주행 시스템 안정성 테스트
    - 보도/횡단보도 주행 관련 운행안전인증 심사 대응

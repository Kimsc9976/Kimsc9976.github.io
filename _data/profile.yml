paragraphs:
  - |
    저는 서비스의 안정성을 **검증하는 과정**을 중요하게 생각합니다. 
  - |
    사용자 만족도가 중요한 서비스 환경에서는 <br> 기능 중심 QA만으로는 Usability를 충분히 검증하기 어렵다 생각하기에,<br>
    **유저 시나리오 기반 테스트 전략**과 **자동화 인프라 설계**를 통해<br> 반복 가능하고 확장 가능한 검증 체계를 구축해왔습니다.
  - |
    QA·개발·운영 조직이 동일한 기준으로 품질을 해석할 수 있도록 검증 데이터를 구조화하고,<br>
    품질을 개인의 역량이 아닌 **시스템으로 관리**하는 환경을 만들어가고자 합니다.

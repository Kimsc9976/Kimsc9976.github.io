- title: QA 자동화 인프라 구축
  period: 2025.06 ~ 2026.02
  summary: 배포 전 신뢰성 확보를 위한 자동화 QA 인프라 구축
  points:
    - HILS 기반 반복 검증 자동화 인프라 설계 및 구축
    - 시뮬레이션 연동을 통한 주행 시나리오 커버리지 확보
    - 플랫폼 API 연동 1,000회 이상 장기 반복 스트레스 테스트로 SW 강건성 검증
    - 인적 개입 최소화로 반복 검증 리소스 약 80% 절감
    - 자동화된 결과 축적으로 테스트 재현성 및 추적성 확보
  detail_url: /practice/qa-automation-infrastructure/

- title: 유저 시나리오 기반 웹페이지 QA 자동화
  period: 2025.02 ~ 2025.06
  summary: 사용자 행동 기반 시나리오를 자동화 및 프로덕션 모니터링으로 확장
  points:
    - 사용자 행동 데이터를 기반으로 핵심 유저 시나리오 테스트 케이스 정의
    - Playwright를 활용한 유저 시나리오 자동화 테스트 구축
    - Checkly 기반 프로덕션 플로우 모니터링으로 배포 후 이상 징후 실시간 감지
  detail_url: /practice/web-scenario-automation/

- title: 데이터 시각화 도구 구축
  period: 2024.12 / 2026.06 ~ 2026.09
  summary: 로봇 로그부터 인지(Perception) 결과까지, 공통 기준으로 해석하는 QA 시각화 도구 구축
  points:
    - "[NTT] ROS2 토픽·상태 코드를 명세 기반 시각 정보로 변환하는 로깅 시각화 도구"
    - "[NTT] 개발·QA·운영 등 3개 부서의 표준 디버깅 도구로 채택"
    - "[SS Tool] Semantic Segmentation·Object Detection 결과를 검증하는 웹 도구"
    - 이슈 재현 및 원인 분석 시간 단축을 위한 UI 제공
    - 분석 기준 표준화를 통해 커뮤니케이션 비용 감소
  detail_url: /practice/qa-visualization-tools/

- title: 시뮬레이터 기반 검증 환경 구축
  period: 2026.03 ~
  summary: 실기체 투입 전 주행 시나리오를 반복 재현하기 위한 QA 테스트베드 구축 및 평가
  points:
    - SimWorld(Unreal Engine + UnrealCV)에 실제 로봇과 동일한 센서 배치로 환경 구성
    - 다중 카메라 FPS 급락(20~25 → 2~5)의 구조적 원인 분석 및 오픈소스 이슈 보고
    - URBAN-SIM(Isaac Sim) 비교 — 재현성·디버깅·운영 비용 기준 QA 적합성 평가
    - 검증 목적에 맞는 테스트베드 선택 기준 정리 및 팀 공유
  detail_url: /practice/simulator-verification/


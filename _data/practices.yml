    - SW/HW 업데이트에 따른 TC 확장 및 우선순위 기반 검증
    - 촉박한 심사 일정 속 유관부서 협업을 통한 인증 통과 기여
  detail_url: /practice/safety-certification-qa

- title: 로봇 배달 PoC 대응
  period: 2024.04 / 2024.09

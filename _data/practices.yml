# QA Engineering Practice — About 카드 + 상세 페이지(practice/*) 상단 "성과"
# - summary: 한 줄 성과 (결과부터)
# - points: 성과 위주 3~4개. 상세 페이지 맨 위 "성과" 섹션에 그대로 쓰인다
# - detail_url: 상세 페이지. 관련 프로젝트는 projects.yml 에서 같은 detail_url 로 자동 연결
# - 외부 공유용: 제품 성능 수치(성공률·결함 수·장비 사양 등)는 범위·하한으로만 쓴다
# - 순서: About 캐러셀 첫 장(4개)에 대표 Practice 가 오도록 정렬

- title: 도심 시뮬레이터 검증 환경 구축
  period: 2026.03 ~ 2026.11
  summary: 실제 도심을 시뮬레이터로 옮기고, 실제 로봇 컴퓨터를 붙여 반복 시험하는 환경 완성
  points:
    - 지도 데이터로 도심 월드를 자동 생성하는 맵 빌더 구축
    - 자율주행 스택 코드 수정 없이 HILS·SILS 연결, 다중 로봇 동시 주행
    - 렌더·메모리 최적화로 보행자·차량이 다니는 시험 환경 지원
    - 검증도구 연동 후 건널목 시험에서 자율주행 결함 검출·등록
  detail_url: /practice/simulator-verification/

- title: 자율주행 검증 자동화 인프라 구축
  period: 2024.01 ~ 2024.05 / 2025.06 ~ 2026.02
  summary: 사람이 돌리던 자율주행 반복 시험을 무인화해, 반복 시험 결과로 배포를 판단하게 만듦
  points:
    - 시뮬레이터 검증도구를 직접 개발하고 HILS·플랫폼 API로 확장
    - 기능·경로당 100회 이상 무인 반복, 결과 리포트 자동 생성
    - 부팅~배차~재부팅 사이클을 1,000회 단위로 돌리는 강건성 테스트 운영
    - 반복 검증 인력 투입 약 80% 절감, 연결 끊김·재부팅 결함을 배포 전에 검출
  detail_url: /practice/qa-automation-infrastructure/

- title: 로봇 데이터 시각화·인지 검증 도구
  period: 2024.12 / 2026.06 ~ 2026.10
  summary: 로봇 로그와 인지 결과를 QA·개발·운영이 같은 화면, 같은 지표로 보게 만든 도구 2종
  points:
    - "[NTT] 상태 코드를 설명으로 바꿔 보여주는 디버깅 도구, 3개 부서 표준 도구로 채택"
    - "[SS Tool] 인지 결과를 ROI 점유율·GT 픽셀 일치율로 정량 검증"
    - 인지 모듈 버전 비교를 데이터 준비부터 리포트까지 자동화
    - 결과를 만든 버전의 클래스 정의로 판독하도록 바꿔 버전 간 오판 제거
  detail_url: /practice/qa-visualization-tools/

- title: 유저 시나리오 기반 웹 QA 자동화
  period: 2025.02 ~ 2025.06
  summary: 사용자 행동 데이터로 핵심 흐름을 골라 자동화하고, 배포 후 운영 환경까지 감시
  points:
    - 사용자 행동 데이터로 핵심 유저 시나리오 정의
    - Playwright로 제품군 단위 시나리오 자동화, 릴리즈마다 회귀 검증
    - Checkly로 운영 환경 핵심 흐름을 주기 실행해 배포 후 이상 감지
    - UI/UX 개선안 A/B 테스트·Usability Test 설계와 결과 검증
  detail_url: /practice/web-scenario-automation/

- title: 유저 시나리오 기반 테스팅
  period: 2024.04 ~ 2024.10
  summary: 기능 체크리스트였던 Sanity Test를 사용자 흐름 기준으로 다시 짜서 릴리즈 후 CS 이슈 감소
  points:
    - 릴리즈 후 CS 이슈 발생률 15% 이상 감소
    - 로봇–웹 연동 구간을 시나리오에 넣어 연동 결함을 릴리즈 전에 발견
    - CS 이슈와 QA 발견 이슈를 대조해 놓친 흐름을 시나리오에 추가
    - 기능 명세 리뷰 단계에 QA 참여, TC–명세 정합성 확보
  detail_url: /practice/user-scenario-testing/

- title: 운행안전인증 QA 대응
  period: 2024.04 / 2024.12 / 2026.09
  summary: 실외이동로봇 운행안전인증 심사 기준을 TC로 옮겨 검증하고 인증 통과에 기여
  points:
    - 심사 기준을 항목별 TC로 작성·수행
    - SW/HW 업데이트에 맞춰 TC 확장, 리스크 우선순위로 재검증 순서 결정
    - 인증 기능 검증을 자동화 테스트 모듈로 옮겨 반복 가능하게 정리
    - Third Party 통합 기체의 보도·횡단보도 주행 심사 대응
  detail_url: /practice/safety-certification-qa/

- title: 로봇 배달 PoC 현장 QA
  period: 2024.04 / 2024.09
  summary: 고객사 현장에서 PoC 셋업과 전 구간 자율주행 시험을 맡고, 현장 이슈를 재현 조건으로 정리해 전달
  points:
    - 고객사 2곳 PoC 현장 셋업 및 전 구간 자율주행 시험 수행
    - 특정 구간 반복 성능 저하를 구간·조건 단위로 특정해 보고
    - 주행 경로·운행 특이사항을 정리해 운영 리스크 사전 공유
    - 주 고객층 관점의 현장 피드백을 수집해 유관부서 전달
  detail_url: /practice/robot-poc-qa/

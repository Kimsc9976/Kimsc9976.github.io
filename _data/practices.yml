- title: QA 자동화 인프라 구축
  period: 2025.06 ~ 2025.02
  summary: 배포 전 신뢰성 확보를 위한 자동화 QA 인프라 구축
  points:
    - HILS 기반 반복 검증 자동화 인프라 설계 및 구축
    - 시뮬레이션 연동을 통한 주행 시나리오 커버리지 확보
    - 내부 API 연동 자동 스트레스 테스트 환경 구성
    - 수천 회 반복 시나리오 기반 안정성·강건성 검증 체계 마련
    - 자동화된 결과 축적으로 테스트 재현성 및 추적성 확보
  detail_url: /practice/qa-automation-infrastructure

- title: 유저 시나리오 기반 웹페이지 QA 자동화
  period: 2025.02 ~ 2025.06
  summary: 사용자 행동 기반 시나리오를 자동화 및 프로덕션 모니터링으로 확장
  points:
    - 사용자 행동 데이터를 기반으로 핵심 유저 시나리오 테스트 케이스 정의
    - Playwright를 활용한 유저 시나리오 자동화 테스트 구축
    - Checkly 기반 프로덕션 플로우 모니터링으로 배포 후 이상 징후 실시간 감지

- title: 데이터 시각화 도구 구축
  period: 2024.01 ~ 2024.12
  summary: 테스트·운영·CS 간 분석 기준을 통합한 QA 시각화 도구 구축
  points:
    - 테스트 결과 및 로그를 공통 기준으로 해석 가능한 시각화 도구 설계
    - 바이트 단위 Raw 데이터를 명세 기반 시각 정보로 변환
    - 이슈 재현 및 원인 분석 시간 단축을 위한 UI 제공
    - QA·개발·운영 조직에서 공통 디버깅 도구로 활용
    - 분석 기준 표준화를 통해 커뮤니케이션 비용 감소
  detail_url: /practice/qa-visualization-tools

- title: 유저 시나리오 기반 테스팅
  period: 2024.04 ~ 2024.10
  summary: 기능 중심 QA에서 유저 시나리오 기반 QA로 전환
  points:

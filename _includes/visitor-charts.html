<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<section class="graph-container">
  <div class="stats-tabs">
    <div class="tab-btn active" onclick="openTab(event, 'dailyPanel')">주간</div>
    <div class="tab-btn" onclick="openTab(event, 'monthlyPanel')">월간</div>
  </div>

  <div class="stats-container">
    <div id="dailyPanel" class="chart-panel active">
      <canvas id="dailyChart"></canvas>
    </div>
    <div id="monthlyPanel" class="chart-panel">
      <canvas id="monthlyChart"></canvas>
    </div>  
  </div>
</section>

<script>
// 탭 전환 함수
function openTab(evt, tabName) {
  const panels = document.getElementsByClassName("chart-panel");
  for (let i = 0; i < panels.length; i++) {
    panels[i].classList.remove("active");
  }
  const btns = document.getElementsByClassName("tab-btn");
  for (let i = 0; i < btns.length; i++) {
    btns[i].classList.remove("active");
  }
  document.getElementById(tabName).classList.add("active");
  evt.currentTarget.classList.add("active");

  // 필요 시(특히 숨김 상태에서 생성하면 깨짐) 탭 진입 시점에 차트 생성
  if (tabName === "dailyPanel") window.__initDailyChart?.();
  if (tabName === "monthlyPanel") window.__initMonthlyChart?.();

  // display:none → block 전환 후 Chart.js가 크기를 다시 계산하도록 보정
  // (숨겨진 canvas에서 생성/렌더되면 높이/폭이 찌그러지거나 '와따가따'하는 현상 방지)
  requestAnimationFrame(() => {
    if (tabName === "dailyPanel") {
      window.__dailyChart?.resize();
      window.__dailyChart?.update();
    }
    if (tabName === "monthlyPanel") {
      window.__monthlyChart?.resize();
      window.__monthlyChart?.update();
    }
  });
}

(function() {
  // Jekyll 데이터 할당
  const rawData = {{ site.data.stats | jsonify }};
  let statsData = null;
  try {
      statsData = rawData.home;
  } catch (e) {
      console.error("데이터 로드 실패:", e);
  }

  if (!statsData) return;

  
  const getSmartMax = (dataArray) => {
    if (!dataArray || dataArray.length === 0) return 5;
    const maxVal = Math.max(...dataArray.map(d => d.value));
    return maxVal === 0 ? 5 : maxVal * 1.2;
  };
  
  const makeOptions = (dataArray) => ({
    responsive: true,
    maintainAspectRatio: false, // ★ 부모 컨테이너 크기에 맞추기 위해 필수
    scales: {
      x: { offset: true },
      // 탭마다 데이터가 다른데 suggestedMax를 daily 기준으로 고정하면 월간 축이 이상해짐
      y: {
        beginAtZero: true,
        suggestedMax: getSmartMax(dataArray),
        ticks: { stepSize: 1 },
      },
    },
  });

  // 1. 주간 차트 (Line)
  window.__initDailyChart = () => {
    if (window.__dailyChart) return;
    const dailyCtx = document.getElementById('dailyChart');
    if (!dailyCtx || !statsData.daily) return;

    window.__dailyChart = new Chart(dailyCtx, {
      type: 'line',
      data: {
        labels: statsData.daily.map(d => d.date),
        datasets: [{
          label: '방문자(Active Users)',
          data: statsData.daily.map(d => d.value),
          borderColor: '#3498db',
          backgroundColor: 'rgba(52, 152, 219, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: makeOptions(statsData.daily)
    });
  };

  // 2. 월간 차트 (Bar)
  window.__initMonthlyChart = () => {
    if (window.__monthlyChart) return;
    const monthlyCtx = document.getElementById('monthlyChart');
    if (!monthlyCtx || !statsData.monthly) return;

    window.__monthlyChart = new Chart(monthlyCtx, {
      type: 'bar',
      data: {
        labels: statsData.monthly.map(d => d.month),
        datasets: [{
          label: '월간 방문자',
          data: statsData.monthly.map(d => d.value),
          backgroundColor: '#2ecc71',
          barPercentage: 0.5
        }]
      },
      options: makeOptions(statsData.monthly)
    });
  };

  // 초기 로드: 기본 탭(주간)만 먼저 생성해서 숨김 패널 계산 문제를 피함
  window.__initDailyChart();
})();
</script>

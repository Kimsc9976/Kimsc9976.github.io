<!-- 기존 고정 메뉴 -->
<aside>
  <div class="sidebar">
    <h1 class="sidebar-title">📚 목차</h2>

    <nav class="main-links">
      {% for item in site.data.sidebar.main %}
        <a href="{{ item.url }}" class="nav-item {% if page.url == item.url %}active{% endif %}">
          {{ item.title }}
        </a>
      {% endfor %}
    </nav>

    <hr class="sidebar-divider">
    <h3> 🛠️ 준비중</h3>
    <hr class="sidebar-divider">
    <h3> 👩🏻‍💻 알고리즘 리스트</h3>
    <!-- 자동 알고리즘 -->
    {% for platform in site.data.sidebar.algorithm %}
    <details class="sidebar-group">
      <summary class="toggle-text">{{ platform[0] }}</summary>
      <ul>
        {% for tier in platform[1] %}
        <li>
          <a href="/algorithm/{{ platform[0] }}/{{ tier }}/">
            {{ tier }}
          </a>
        </li>
        {% endfor %}
      </ul>
    </details>
    {% endfor %}
    <hr class="sidebar-divider">
  </div>
</aside>

<!-- 기존 고정 메뉴 -->
<aside class="sidebar">
    <h2>목차</h2>

{% for item in site.data.sidebar.main %}
  <a href="{{ item.url }}">{{ item.title }}</a>
{% endfor %}

<hr>
<h3> 🛠️ 준비중</h3>
<hr>
<h3> 👩🏻‍💻 알고리즘 리스트</h3>
<!-- 자동 알고리즘 -->
{% for platform in site.data.sidebar.algorithm %}
<details class="sidebar-group">
  <summary class="toggle-text">{{ platform[0] }}</summary>
  <ul>
    {% for tier in platform[1] %}
    <li>
      <a href="/algorithm/{{ platform[0] }}/{{ tier }}/">
        {{ tier }}
      </a>
    </li>
    {% endfor %}
  </ul>
</details>
{% endfor %}
<hr>
</aside>

<style>
    .toggle-text:hover {
        text-decoration: underline;
        /* 밑줄 추가 */
        font-size: 1.1em;
        /* 텍스트 크기 약간 증가 */
        text-shadow: 2px 2px 4px #aaa;
        /* 텍스트 그림자 효과 */
    }
</style>

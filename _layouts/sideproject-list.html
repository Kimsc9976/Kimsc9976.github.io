---
layout: default
---

<section class="sideproject-home">
  <header class="page-intro">
    <p class="page-intro__eyebrow">Side Project</p>
    <h1>{{ page.title }}</h1>

    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}

    {% if page.period or page.tech %}
    <p class="page-intro__meta">
      {% if page.period %}<span class="period">{{ page.period }}</span>{% endif %}
      {% if page.tech %}<span class="tech">{{ page.tech | join: " · " }}</span>{% endif %}
    </p>
    {% endif %}
  </header>

  {{ content }}
</section>

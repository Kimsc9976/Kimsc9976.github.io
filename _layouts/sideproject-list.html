---
layout: default
---

<section class="sideproject-home">
  <header class="page-header">
    <h1>{{ page.title }}</h1>

    {% if page.description %}
      <p class="page-desc">{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="sideproject-meta">
    {% if page.period %}
      <span class="period">{{ page.period }}</span>
    {% endif %}
    {% if page.tech %}
      <span class="tech">{{ page.tech | join: " · " }}</span>
    {% endif %}
  </div>

  <hr />

  {{ content }}
</section>

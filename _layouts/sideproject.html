---
layout: default
---

<article class="sideproject-post">
  <header class="post-header">
    <h1>{{ page.title }}</h1>

    <div class="post-meta">
      {% if page.date %}
        <span class="date">{{ page.date | date: "%Y.%m.%d" }}</span>
      {% endif %}
      {% if page.tags %}
        <span class="tags">{{ page.tags | join: " · " }}</span>
      {% endif %}
    </div>
  </header>

  <div class="post-content">
    {{ content }}
  </div>

  <footer class="post-footer">
    <a href="{{ page.parent_url }}">
      ← 프로젝트 홈으로
    </a>
  </footer>
</article>

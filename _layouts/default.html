<!DOCTYPE html>
<html lang="en">

{% include head.html %}

<body>
    <header>
        <div class="header-content">
            <h1>{{ site.title }}</h1>
            <p>{{ site.description }}</p>
            <a href="{{ '/' | relative_url }}" class="home-button">🏠 홈으로</a>
        </div>
    </header>
    <div class="container">
        {% include sidebar.html %}
        <main class="content">
            {{ content }}
        </main>
    </div>
    <footer>
        <p>© 2024 Kimsc9976</p>
    </footer>
    {% if page.layout == 'about' %}
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    {% endif %}
    {% if page.layout == 'algorithm' or page.layout == 'platform' or page.layout == 'tier' %}
    <script src="{{ '/assets/js/problem-search.js' | relative_url }}" defer></script>
    {% endif %}
</body>


</html>

---
layout: default
---

<div class="tier-header algo-page-header">
  <div class="tier-header-info">
    {% if page.platform_url %}
    <a href="/algorithm/{{ page.platform_url }}/" class="tier-badge">{{ page.platform }}</a>
    {% else %}
    <a href="/algorithm/{{ page.platform }}/" class="tier-badge">{{ page.platform }}</a>
    {% endif %}
    <div class="tier-main">
      <span class="tier-title">{{ page.title }}</span>
      <span class="tier-sub">Problem Archive</span>
    </div>
  </div>
  {% include problem-search.html %}
</div>


<div class="tier-content">
  {{ content }}
</div>

<script>
document.querySelectorAll('.tier-content h2').forEach(header => {
  header.addEventListener('click', () => {
    header.classList.toggle('open')
    const list = header.nextElementSibling
    list.classList.toggle('collapsed')
  })
})
</script>
